<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Cartera Cripto</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Cartera">
<meta name="theme-color" content="#f3efe8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: una columna estrecha de móvil — resumen → pregunta → ranking → tarjetas; detalle en hoja que sube desde abajo */
:root{
  --papel:#f3efe8; --carta:#ffffff; --tinta:#111821; --gris:#5d6876; --gris2:#98a2ae; --linea:#e3e7ec;
  --acento:#0f5c66; --acento-suave:#e2f0f1;
  --gana:#178a4c; --gana-suave:#e3f4ea; --pierde:#cc3f2c; --pierde-suave:#fbe7e3; --aviso:#b77c00; --aviso-suave:#fdf2d9;
  --btc:#f2a33a; --eth:#6273e8; --usdc:#2e78d2;
  --f-titulo:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-texto:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta)}
body{font:15px/1.45 var(--f-texto);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px;min-width:0;width:100%}
.app>*{min-width:0}
main .app{padding-top:0}
html,body{overflow-x:hidden}
h1,h2,h3{font-family:var(--f-titulo);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,.tarjeta:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
[hidden]{display:none!important}

/* Candado */
.candado{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:360px;margin:0 auto}
.candado .logo{font-size:44px}
.candado input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--linea);font-size:17px;background:var(--carta)}
.candado label{display:flex;gap:8px;align-items:center;color:var(--gris);font-size:14px}
.btn{background:var(--acento);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px}
.error{color:var(--pierde);font-size:14px;min-height:20px}

/* Cabecera */
.cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cab h1{font-size:22px}
.precios{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--linea);color:var(--gris)}
.chip.gana{background:var(--gana-suave);color:var(--gana)} .chip.pierde{background:var(--pierde-suave);color:var(--pierde)}
.chip.aviso{background:var(--aviso-suave);color:var(--aviso)} .chip.acento{background:var(--acento-suave);color:var(--acento)}
.punto{width:7px;height:7px;border-radius:50%;background:currentColor}

/* Resumen */
.resumen{background:linear-gradient(160deg,#e4f1ee,#f7f2e6);border:1px solid #d6e6e1;color:var(--tinta);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.resumen .etq{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--gris)}
.resumen .grande{font-family:var(--f-titulo);font-size:38px;font-weight:700;line-height:1}
.resumen .fila{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.resumen .fila b{display:block;font-family:var(--f-titulo);font-size:17px}
.resumen .verde{color:var(--gana)} .resumen .rojo{color:var(--pierde)}
.reparto{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--gris)}
.leyenda i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* Pregunta */
.pregunta{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pregunta form{display:flex;gap:8px}
.pregunta input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:10px;padding:11px 12px;font-size:16px;background:var(--papel)}
.pregunta form button{border:0;background:var(--acento);color:#fff;border-radius:10px;padding:0 14px;font-weight:600}
.sugerencias{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sugerencias button{border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:6px 11px;font-size:13px;white-space:nowrap}
.respuesta{background:var(--acento-suave);border-radius:12px;padding:12px;font-size:14px}
.respuesta p{margin:0 0 6px} .respuesta p:last-child{margin:0}
.respuesta ul{margin:4px 0 0;padding-left:18px}

/* Ranking */
.bloque{display:flex;flex-direction:column;gap:10px}
.cab-bloque{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ranking{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rk{display:grid;grid-template-columns:110px minmax(0,1fr) 74px;gap:10px;align-items:center;font-size:13px}
.rk .nom{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nom small{display:block;font-weight:400;color:var(--gris2)}
.rk .barra{height:12px;background:var(--papel);border-radius:6px;overflow:hidden}
.rk .barra span{display:block;height:100%;border-radius:6px;background:var(--acento)}
.rk .val{text-align:right;font-weight:600;white-space:nowrap}
.conmutar{display:flex;background:var(--linea);border-radius:10px;padding:3px}
.conmutar button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--gris)}
.conmutar button[aria-pressed=true]{background:var(--carta);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Tipos */
.tipos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tipos button{border:1px solid var(--linea);background:var(--carta);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tipos button[aria-pressed=true]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tipos .n{font-size:12px;opacity:.7}
.acciones{display:flex;gap:6px}
.acciones button{border:0;background:none;color:var(--acento);font-size:13px;font-weight:600;padding:4px}

/* Tarjetas */
.lista{display:flex;flex-direction:column;gap:10px}
.tarjeta{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.tarjeta.cerrada{background:transparent;border-style:dashed}
.t-cab{display:flex;align-items:center;gap:10px}
.monedas{display:flex;flex:none}
.moneda{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;border:2px solid var(--carta);font-family:var(--f-titulo)}
.moneda + .moneda{margin-left:-10px}
.t-nom{flex:1;min-width:0}
.t-nom b{font-family:var(--f-titulo);font-size:16px;display:block}
.t-nom small{color:var(--gris);font-size:12px}
.t-num{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.t-num div{display:flex;flex-direction:column}
.t-num span{font-size:11px;color:var(--gris2);text-transform:uppercase;letter-spacing:.05em}
.t-num b{font-family:var(--f-titulo);font-size:16px;font-weight:600}
.gana-t{color:var(--gana)} .pierde-t{color:var(--pierde)} .gris-t{color:var(--gris2)}

/* Barra de rango */
.rango{position:relative;height:34px;overflow:hidden;margin:0 14px}
.rango .pista{position:absolute;left:0;right:0;top:12px;height:8px;border-radius:4px;background:var(--papel);border:1px solid var(--linea)}
.rango .zona{position:absolute;top:12px;height:8px;border-radius:4px;background:var(--acento);opacity:.85}
.rango .zona.fuera{background:var(--gris2)}
.rango .marca{position:absolute;top:4px;width:2px;height:24px;background:var(--tinta);border-radius:1px}
.rango .marca::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--tinta)}
.rango .lim{position:absolute;top:22px;font-size:10px;color:var(--gris);white-space:nowrap}

.vacio{background:var(--carta);border:1px dashed var(--linea);border-radius:16px;padding:22px;text-align:center;color:var(--gris);display:flex;flex-direction:column;gap:6px;align-items:center}
.vacio .e{font-size:30px}

/* Hoja de detalle */
.velo{position:fixed;inset:0;background:rgba(17,24,33,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--papel);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}
.asa{width:40px;height:5px;border-radius:3px;background:var(--linea);margin:0 auto}
.h-cab{display:flex;align-items:center;gap:10px}
.h-cab h3{font-size:20px;flex:1}
.cerrar{border:0;background:var(--linea);width:34px;height:34px;border-radius:50%;font-size:18px}
.caja{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pnl{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px}
.pnl .grande{font-family:var(--f-titulo);font-size:32px;font-weight:700;line-height:1}
.flujo{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.flujo .paso{background:var(--papel);border-radius:10px;padding:6px 9px;display:flex;flex-direction:column}
.flujo .paso small{color:var(--gris2);font-size:11px}
.flujo .flecha{color:var(--gris2)}
.linea-t{position:relative;height:46px}
.linea-t .l{position:absolute;left:8px;right:8px;top:9px;height:3px;background:var(--linea)}
.linea-t .l span{display:block;height:100%;background:var(--acento)}
.linea-t .p{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--acento);border:3px solid var(--carta);box-shadow:0 0 0 1px var(--acento)}
.linea-t .p.fin{right:0} .linea-t .p.ini{left:0}
.linea-t .p.hoy{background:var(--carta)}
.linea-t .txt{position:absolute;top:24px;font-size:12px;color:var(--gris)}
.linea-t .txt.der{right:0;text-align:right}
.linea-t .dias{position:absolute;left:50%;transform:translateX(-50%);top:-4px;font-size:11px;font-weight:600;background:var(--carta);padding:0 6px;color:var(--acento)}
details{background:var(--carta);border:1px solid var(--linea);border-radius:14px}
summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--gris2)} details[open] summary::after{content:"－"}
.dl{padding:0 14px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--gris)} .dl dd{margin:0;text-align:right;font-weight:500}
.nota{padding:0 14px 12px;font-size:13px;color:var(--gris)}
a.enlace{color:var(--acento);font-weight:600;text-decoration:none}
.pie{text-align:center;font-size:12px;color:var(--gris2)}
/* Billeteras */
.cartera{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.c-cab{display:flex;align-items:center;gap:10px}
.c-cab .ico{width:34px;height:34px;border-radius:10px;background:var(--acento-suave);display:grid;place-items:center;font-size:18px;flex:none}
.c-cab .t-nom small{font-family:ui-monospace,Menlo,monospace}
.c-cab .tot{font-family:var(--f-titulo);font-weight:700;font-size:18px}
.tok{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--linea)}
.tok .moneda{width:28px;height:28px;font-size:10px}
.tok b{font-weight:600} .tok small{display:block;color:var(--gris2);font-size:12px}
.tok .der{text-align:right}
.form-bill{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.form-bill input{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--papel);min-width:0}
.form-bill .fila-b{display:flex;gap:8px}
.borrar{border:0;background:none;color:var(--gris2);font-size:12px;padding:2px 4px}
.refrescar{border:1px solid var(--linea);background:var(--carta);border-radius:999px;width:30px;height:30px;font-size:15px;line-height:1}
.girando{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cab-der{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:0}
/* Aave */
.aave{border-top:1px solid var(--linea);padding-top:10px;display:flex;flex-direction:column;gap:8px;border:0;background:none;text-align:left;width:100%;padding-left:0;padding-right:0}
.aave .fila-a{display:flex;align-items:center;gap:8px}
.aave .fila-a b{flex:1;font-family:var(--f-titulo)}
.balanza{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--papel)}
.balanza .pon{background:var(--acento)} .balanza .deb{background:var(--pierde);opacity:.85}
.mini{display:flex;justify-content:space-between;font-size:12px;color:var(--gris)}
.salud{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--pierde) 0%,var(--aviso) 30%,var(--gana) 60%,var(--gana) 100%)}
.salud i{position:absolute;top:-4px;width:4px;height:22px;border-radius:2px;background:var(--tinta);box-shadow:0 0 0 2px var(--carta)}
.movs{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.movs li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:baseline}
.movs small{color:var(--gris2)}
@media (max-width:380px){.rk{grid-template-columns:86px 1fr 56px}.resumen .grande{font-size:32px}}
</style>
</head>
<body>
<div class="app">

  <!-- 🔒 Candado -->
  <form class="candado" id="candado" autocomplete="on">
    <div class="logo">🔐</div>
    <h1>Mi Cartera Cripto</h1>
    <input type="text" name="username" id="usuario" value="glenda" autocomplete="username" hidden>
    <input type="password" id="clave" name="password" autocomplete="current-password" placeholder="Contraseña" required>
    <label><input type="checkbox" id="recordar" checked> Recordar en este móvil</label>
    <button class="btn" type="submit">Entrar</button>
    <div class="error" id="error"></div>
  </form>

  <main id="principal" hidden>
    <div class="app">
      <header class="cab">
        <h1>Mi Cartera</h1>
        <div class="cab-der"><div class="precios" id="precios"></div><button class="refrescar" id="refrescar" aria-label="Actualizar ahora">↻</button></div>
      </header>

      <section class="resumen" id="resumen" aria-label="Resumen total"></section>

      <section class="pregunta" aria-label="Pregúntame">
        <form id="f-pregunta">
          <input id="q" type="text" placeholder="Pregúntame… ¿cuál rinde más?" autocomplete="off" enterkeyhint="send">
          <button type="submit">Preguntar</button>
        </form>
        <div class="sugerencias" id="sugerencias"></div>
        <div class="respuesta" id="respuesta" hidden></div>
      </section>

      <section class="bloque">
        <div class="cab-bloque">
          <h2>🏆 ¿Cuál rinde más?</h2>
          <div class="conmutar" role="group" aria-label="Medida">
            <button id="m-pct" aria-pressed="true">%</button>
            <button id="m-usd" aria-pressed="false">US$</button>
            <button id="m-tarifas" aria-pressed="false">Tarifas</button>
          </div>
        </div>
        <div class="ranking" id="ranking"></div>
      </section>

      <section class="bloque">
        <div class="cab-bloque">
          <h2>📂 Lo que tengo</h2>
          <div class="acciones">
            <button id="ampliar">Ampliar todo</button>
            <button id="resumir">Resumir todo</button>
          </div>
        </div>
        <div class="tipos" id="tipos"></div>
        <div class="lista" id="lista"></div>
      </section>

      <p class="pie" id="pie"></p>
    </div>
  </main>
</div>

<div class="velo" id="velo" hidden><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha3/0.8.0/sha3.min.js"></script>
<script src="cadena.js"></script>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const num = (n, d = 2) => n == null || isNaN(n) ? '—' : new Intl.NumberFormat('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const usd = (n, d = 2) => n == null || isNaN(n) ? '—' : num(n, d) + ' US$';
const signo = (n) => n > 0.004 ? '+' : n < -0.004 ? '−' : '';
const usdS = (n, d = 2) => n == null ? '—' : signo(n) + usd(Math.abs(n), d);
const pct = (n) => n == null || !isFinite(n) ? '—' : signo(n) + num(Math.abs(n), 2) + ' %';
const puesto = (h, par) => [h?.x > 1e-9 ? cant(h.x, par[0]) : '', h?.y > 1e-6 ? cant(h.y, par[1]) : ''].filter(Boolean).join(' + ') || '—';
const cant = (n, sym) => num(n, n >= 1000 ? 0 : n >= 1 ? 2 : n >= 0.01 ? 4 : 6) + ' ' + sym;
const fecha = (s) => s ? new Date(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fechaHora = (s) => s ? new Date(s).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const hora = (s) => new Date(s).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const dias = (a, b) => Math.max(0, Math.round((new Date(b || Date.now()) - new Date(a)) / 864e5));
const corta = (a) => a.length > 14 ? a.slice(0, 7) + '…' + a.slice(-5) : a;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch (e) {} };
const leer = (k, json) => { try { const v = localStorage.getItem(k); return json ? (v ? JSON.parse(v) : null) : v; } catch (e) { return null; } };

const COLOR = { WBTC: 'var(--btc)', BTC: 'var(--btc)', BTCB: 'var(--btc)', cbBTC: 'var(--btc)', WETH: 'var(--eth)', ETH: 'var(--eth)', USDC: 'var(--usdc)', 'USDC.e': 'var(--usdc)', USDT: '#26a17b', ARB: '#28a0f0', SOL: '#9945ff', XRP: '#23292f', XLM: '#14b6e7', HBAR: '#222', XDC: '#2a4fa1', BNB: '#f0b90b', POL: '#8247e5', OP: '#ff0420' };
const ESTABLE = /^(USDC|USDC\.e|USDT|DAI|xDAI)$/;
const TIPOS = [
  { id: 'liquidez', e: '💧', n: 'Liquidez concentrada' },
  { id: 'billetera', e: '👛', n: 'Billeteras' },
  { id: 'compra', e: '🪙', n: 'Compras' },
  { id: 'staking', e: '🔒', n: 'Staking' },
  { id: 'prestamo', e: '🏦', n: 'Préstamos (Aave)' },
];

/* ── 🔐 Candado ─────────────────────────────────── */
async function descifrar(clave) {
  const r = await fetch('datos.enc.json', { cache: 'no-store' });
  if (!r.ok) throw new Error('No encuentro los datos');
  const c = await r.json();
  const b = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(c.sal), iterations: c.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(c.iv) }, llave, b(c.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}
async function entrar(clave, recordar) {
  $('#error').textContent = 'Abriendo…';
  try {
    D = await descifrar(clave);

    $('#candado').hidden = true; $('#principal').hidden = false;

  }
}

      const v4 = await Promise.all(ids.map((id) => Cadena.leerV4(id).catch(() => null)));
      v4.filter(Boolean).forEach((p) => { p.dueño = b.dir; nuevas['v4-' + p.id] = p; });
    }));
    // las que ya no salen (quemadas) se quedan como estaban, marcadas cerradas

    for (const p of Object.values(nuevas)) delete p._raw;

    await Promise.all(bs.map(async (b) => { s[b.dir] = await Cadena.saldos(b.dir).catch(() => saldos[b.dir] || []); }));
    saldos = s;

    aaveVivo = av;

    Object.values(aaveVivo).flat().forEach((x) => [...x.puesto, ...x.debe].forEach((t) => syms.add(t.sym)));
    (D.compras || []).forEach((c) => syms.add(c.token));
    precios = { ...precios, ...(await Cadena.precios([...syms]).catch(() => ({}))) };
    ultimaCarga = new Date().toISOString(); vivo = true;
    guardar('ch_asist_cache', { t: ultimaCarga, foto: Object.values(pos), saldos, precios, aave: aaveVivo });

}
// Para pools nuevas: busca en la cadena cuándo se abrió y cuánto se puso (una sola vez)
async function completarHistorial() {

    try {

      const h = await Cadena.historial(vivoP, p.dueño, hist['_pista_' + k], D.escaneo?.v3Desde);
      if (!h) { hist[k] = { ...(hist[k] || {}), intento: Date.now() }; guardado[k] = hist[k]; guardar('ch_asist_hist', guardado); continue; }
      if (h.retirado) h.retiradoUSD = h.retirado.x * (precioDe(p.par[0]) ?? p.precio) + h.retirado.y;
      hist[k] = { ...(hist[k] || {}), ...h, intento: Date.now() }; guardado[k] = hist[k];

// 🏦 Un "looping" por billetera y red: lo puesto menos lo que se debe
const SIGNO_MOV = { poner: 1, devolver: 1, pedir: -1, sacar: -1, enviar: -1, premio: 0 };
const MOV = { poner: ['📥', 'Pusiste'], pedir: ['💸', 'Pediste'], devolver: ['↩️', 'Devolviste'], sacar: ['📤', 'Sacaste'], enviar: ['➡️', 'Enviaste fuera'], premio: ['🎁', 'Premio recibido'] };

    const k = 'aave:' + d + '|' + x.red, h = aaveHist[d + '|' + x.red];

  const abiertas = ps.filter((p) => !p.cerrada);

  const conDep = ps.filter((p) => p.pnl != null);
  const pnl = conDep.reduce((s, p) => s + p.pnl, 0), dep = conDep.reduce((s, p) => s + p.depositado, 0);
  const pnlAb = abiertas.filter((p) => p.pnl != null).reduce((s, p) => s + p.pnl, 0);

    <div class="leyenda">${trozos.map((t, i) => `<span><i style="background:${t.c};opacity:${1 - (i % 2) * 0.35}"></i>${esc(t.n)} ${num(t.v / total * 100, 0)} %</span>`).join('')}</div>

  pintarRanking(ps, ls); pintarTipos(ps, cs, ls); pintarLista(ps, cs, ls);
  $('#pie').textContent = 'Leído de la cadena ' + fechaHora(ultimaCarga) + ' · se actualiza solo cada 90 s';

function pintarRanking(ps, ls) {
  const val = (p) => medida === 'pct' ? p.pnlPct : medida === 'usd' ? p.pnl : p.tarifas;
  const loops = medida === 'tarifas' ? [] : ls.filter((l) => val(l) != null).map((l) => ({ ...l, par: [nombreLoop(l)], version: 'Aave · ' + l.b.nombre, cerrada: false, h: { abierta: l.abierta } }));
  const lista = [...loops, ...ps].filter((p) => val(p) != null && (medida !== 'tarifas' || !p.cerrada)).sort((a, b) => val(b) - val(a));
  const max = Math.max(...lista.map((p) => Math.abs(val(p))), 0.0001);
  const fmt = (p) => medida === 'pct' ? pct(val(p)) : medida === 'usd' ? usdS(val(p), 0) : usd(val(p), 0);
  $('#ranking').innerHTML = lista.map((p) => `
    <button class="rk" style="border:0;background:none;padding:0;text-align:left" data-id="${p.k}">
      <span class="nom">${esc(p.par.join('/'))}<small>${esc(p.version)} · ${p.cerrada ? 'cerrada' : p.h.abierta ? fecha(p.h.abierta) : 'abierta'}</small></span>
      <span class="barra"><span style="width:${Math.abs(val(p)) / max * 100}%;background:${val(p) < 0 ? 'var(--pierde)' : p.cerrada ? 'var(--gris2)' : 'var(--acento)'}"></span></span>
      <span class="val num ${colorPnl(medida === 'tarifas' ? 1 : val(p))}">${fmt(p)}</span>
    </button>`).join('') || '<span class="gris-t">Sin datos todavía</span>';
}

function tablaDatos(p) {
  const h = p.h, f = [
    ['Abierta', h.abierta ? fechaHora(h.abierta) : 'buscando…'],
    ['Cerrada', h.cerrada ? fechaHora(h.cerrada) : p.cerrada ? 'sí' : 'sigue abierta'],
    ['Días', p.dias ?? '—'],
    ['Rango', `${num(p.rango[0])} → ${num(p.rango[1])}`],
    ['Cuenta', `${esc(nombreCuenta(p.dueño || '', '—'))} · ${esc(corta(p.dueño || ''))}`],
    ['Pusiste', puesto(h.puesto, p.par)],
    ['Valor al poner', usd(p.depositado)],
    ['Precio al abrir', h.precioApertura ? num(h.precioApertura) : '—'],
  ];
  if (!p.cerrada) {
    f.push(['Dentro ahora', puesto(p.cant, p.par)]);
    f.push(['Tarifas sin cobrar', puesto(p.tarifasCant, p.par)]);
    if (p.tarifasAnual != null) f.push(['Tarifas al año', num(p.tarifasAnual) + ' %']);
  }
  if (h.retirado) f.push(['Sacaste', puesto(h.retirado, p.par)]);
  if (h.cobradoUSD) f.push(['Tarifas ya cobradas', usd(h.cobradoUSD)]);
  if (p.anual != null) f.push(['Rentab. al año', pct(p.anual)]);
  return `<dl class="dl num">${f.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
}

function tablaAave(l) {

    ...l.x.debe.map((t) => ['Debes ' + t.sym, `${cant(t.cant, t.sym)} · pagas ${num(t.apy)} %`]),
    ['Intereses al año', `${usdS(l.interesGana - l.interesPaga, 0)} (cobras ${usd(l.interesGana, 0)}, pagas ${usd(l.interesPaga, 0)})`],

}

        <span class="dias">${p.dias == null ? '…' : p.dias === 0 ? 'hoy' : p.dias + ' días'}</span>
        <span class="txt">🟢 ${h.abierta ? fecha(h.abierta) : '…'}</span>
        <span class="txt der">${h.cerrada ? '🔴 ' + fecha(h.cerrada) : '⏳ Sigue abierta'}</span>
      </div>
    </div>
    <div class="caja">
      <span class="chip" style="align-self:flex-start">🎯 Rango de precio${p.cerrada ? '' : ' · ahora ' + num(p.precio, 0)}</span>
      ${barraRango(p)}
    </div>
    <details open><summary>📋 Todos los datos</summary>${tablaDatos(p)}</details>
    ${h.nota ? `<details><summary>📝 Notas</summary><p class="nota">${esc(h.nota)}</p></details>` : ''}
    <a class="enlace" href="${esc(p.url)}" target="_blank" rel="noopener">Abrir en Uniswap ↗</a>
    ${h.tx ? `<a class="enlace" href="https://arbiscan.io/tx/${esc(h.tx)}" target="_blank" rel="noopener">Ver la apertura en Arbiscan ↗</a>` : ''}`;
  $('#velo').hidden = false; $('#cerrar').focus();
}
$('#velo').addEventListener('click', (e) => { if (e.target.id === 'velo' || e.target.id === 'cerrar') $('#velo').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#velo').hidden = true; });

/* ── 💬 Preguntas ──────────────────────────────── */
const SUG = ['¿A cuánto compré Bitcoin?', '¿A cuánto compré XRP?', '¿Cuál rinde más?', '¿Cuánto tengo en total?', '¿Cómo van mis loopings?', '¿Qué está fuera de rango?', '¿Qué he cerrado?'];
$('#sugerencias').innerHTML = SUG.map((s) => `<button type="button">${s}</button>`).join('');
$('#sugerencias').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { $('#q').value = b.textContent; responder(b.textContent); } });
$('#f-pregunta').addEventListener('submit', (e) => { e.preventDefault(); responder($('#q').value); });

function responder(q) {
  const t = q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const ps = pools(), ab = ps.filter((p) => !p.cerrada), cs = carteras();
  const nom = (p) => `<b>${nombrePool(p)}</b>`;
  const token = monedaDe(t);
  let h;
  if (/compr|cuando puse|cuando meti|a cuanto|precio medio/.test(t) || (token && !/pool|rango|rinde/.test(t))) {
    h = respuestaCompras(token);
  } else if (/rentab|rinde|mejor|peor|gana mas|ranking/.test(t)) {
    const pn = ps.filter((p) => p.pnlPct != null).sort((a, b) => b.pnlPct - a.pnlPct);
    const ta = ab.filter((p) => p.tarifasAnual != null).sort((a, b) => b.tarifasAnual - a.tarifasAnual);
    h = pn.length ? `<p>🏆 Mejor resultado: ${nom(pn[0])} ${pct(pn[0].pnlPct)} (${usdS(pn[0].pnl, 0)}).</p><p>👎 Peor: ${nom(pn[pn.length - 1])} ${pct(pn[pn.length - 1].pnlPct)}.</p>` : '';
    if (ta.length) h += `<p>💵 La que más tarifas genera al año: ${nom(ta[0])} (${num(ta[0].tarifasAnual)} %).</p>`;
  } else if (/total|cuanto|tengo|gano|ganancia|beneficio|perdid|resumen/.test(t)) {
    const enB = cs.reduce((s, c) => s + c.total, 0), enP = ab.reduce((s, p) => s + p.valor + p.tarifas, 0);
    const cd = ps.filter((p) => p.pnl != null), g = cd.reduce((s, p) => s + p.pnl, 0), dp = cd.reduce((s, p) => s + p.depositado, 0);
    const lsT = prestamos(), enA = lsT.reduce((s, l) => s + l.vale, 0);
    h = `<p>Tienes <b>${usd(enB + enP + enA)}</b>: ${usd(enP, 0)} en ${ab.length} pools, ${usd(enB, 0)} en billeteras y ${usd(enA, 0)} tuyos en Aave.</p>
      <p>Con las pools llevas <b>${usdS(g)}</b> (${dp ? pct(g / dp * 100) : '—'}), contando las ya cerradas.</p>`;
  } else if (/aave|prestamo|looping|deuda|debo|liquid|salud/.test(t)) {
    const ls = prestamos();
    h = ls.length ? `<ul>${ls.map((l) => `<li><b>${nombreLoop(l)}</b> (${esc(l.b.nombre)}): tuyo ${usd(l.vale, 0)}, debes ${usd(l.deuda, 0)}, salud ${l.hf ? num(l.hf, 2) : '—'}${l.liq ? `; te liquidan si ${l.liq.sym} baja a ${num(l.liq.precio, 0)}` : ''}. Resultado <b>${usdS(l.pnl, 0)}</b></li>`).join('')}</ul>` : '<p>No tienes nada en Aave.</p>';
  } else if (/rango|fuera|dentro/.test(t)) {
    const fu = ab.filter((p) => !p.dentro);
    h = fu.length ? `<p>🔴 Fuera de rango (ahora no cobran tarifas):</p><ul>${fu.map((p) => `<li>${nom(p)} — precio ${num(p.precio, 0)}, rango ${num(p.rango[0], 0)}–${num(p.rango[1], 0)}</li>`).join('')}</ul>`
      : `<p>🟢 Todas las abiertas están dentro de rango ahora mismo.</p>`;
  } else if (/cerrad|cerre|cierre/.test(t)) {
    const ce = ps.filter((p) => p.cerrada);
    h = ce.length ? `<ul>${ce.map((p) => `<li>${nom(p)}: ${fecha(p.h.abierta)} → ${fecha(p.h.cerrada)} (${p.dias ?? '?'} días). Pusiste ${usd(p.depositado, 0)}, sacaste ${usd(p.valor, 0)} → <b>${usdS(p.pnl, 0)}</b></li>`).join('')}</ul>` : '<p>No has cerrado ninguna.</p>';
  } else if (/billetera|cartera|saldo|wallet/.test(t)) {
    h = `<ul>${cs.map((c) => `<li><b>${esc(c.nombre)}</b>: ${usd(c.total, 0)}${c.toks.length ? ' (' + c.toks.slice(0, 3).map((x) => cant(x.cant, x.sym)).join(', ') + ')' : ''}</li>`).join('')}</ul>`;
  } else if (token) {
    const rel = ps.filter((p) => p.par[0].includes(token));
    h = `<p>Pools con ${token} (precio ahora ${num(precioDe('W' + token), 0)}):</p><ul>${rel.map((p) => `<li>${nom(p)} — ${p.cerrada ? 'cerrada' : usd(p.valor + p.tarifas, 0)}, ${pct(p.pnlPct)}</li>`).join('')}</ul>`;
  } else {
    h = '<p>Prueba con: «¿cuál rinde más?», «¿cuánto tengo?», «¿qué está fuera de rango?», «¿cuándo compré BTC?», «¿qué he cerrado?» o «saldo de billeteras».</p>';
  }
  const r = $('#respuesta'); r.innerHTML = h || '<p>No encuentro nada sobre eso.</p>'; r.hidden = false;
}

const recordada = leer('ch_asist_clave');
if (recordada) entrar(recordada, true);
</script>
